name: tide

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "tools/**"
      - ".github/workflows/tide.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tide-windows-x64.exe
            built: dist/tide.exe
          - os: macos-latest
            asset: tide-macos-arm64
            built: dist/tide
          - os: ubuntu-latest
            asset: tide-linux-x64
            built: dist/tide
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install the tools' packages
        run: python -m pip install -r tools/requirements.txt -r tools/requirements-build.txt
      - name: Test the tools
        run: python -m unittest discover -s tools/tests
      - name: Build one file
        run: >
          python -m PyInstaller --onefile --console --name tide
          --paths tools --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller
          tools/tide/__main__.py
      - name: Smoke test
        run: |
          ${{ matrix.built }} --help
          ${{ matrix.built }} sync --help
          mkdir -p smoke/.rippl smoke/Artist/Album
          python -c "import sys; sys.path[:0] = ['tools', 'tools/tests']; from pathlib import Path; from test_library_index import write_silent_flac; write_silent_flac(Path('smoke/Artist/Album/01 - Song.flac'), 1)"
          ${{ matrix.built }} sync smoke --dry-run
      - name: Name the file for its platform
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish the files with the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes "" --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
